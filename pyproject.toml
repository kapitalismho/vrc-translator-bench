[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrc-translator-bench"
version = "0.2.0"
description = "Local corpus preparation and resumable Windows audio-to-OSC capture"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = ["sounddevice>=0.5", "numpy>=1.26"]
test = ["pytest>=8", "numpy>=1.26", "soundfile>=0.12", "jieba==0.42.1"]

[project.scripts]
prepare-english = "tools.prepare_english:main"
bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["tools", "bench"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
