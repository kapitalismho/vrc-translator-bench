[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrc-translator-bench"
version = "0.1.0"
description = "Local corpus preparation for VRC Translator Bench"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26", "soundfile>=0.12", "jieba==0.42.1"]

[project.scripts]
prepare-english = "tools.prepare_english:main"

[tool.setuptools.packages.find]
include = ["tools"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
