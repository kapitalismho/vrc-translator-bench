[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrc-translator-bench"
version = "0.2.0"
description = "Windows capture, judge transport and cost infrastructure for a native-output translation benchmark"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = ["sounddevice>=0.5", "numpy>=1.26"]
test = ["pytest>=8", "numpy>=1.26"]

[project.scripts]
bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["tools", "bench"]
namespaces = true

[tool.setuptools.package-data]
bench = ["quality_bridge.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
